        <h1 style="font-size:2rem">Rhumb</h1>
        <p>Rhumb interprets world events into their market consequences — the mechanism, the assets
        affected, the horizon and the confidence — and then scores every one of those calls against
        what actually happened, publishing the record with the misses first.</p>
        <p>This page shows live data from the product, which needs JavaScript. The accuracy record
