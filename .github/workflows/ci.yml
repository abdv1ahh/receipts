# CI: the 189+ test suite is fast (under a second) and fully offline, so there is no reason for a
# push to ever land untested. Lint and a secret scan run on the same trigger.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks needs history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Ruff is PINNED, here and in the Makefile, and the two must stay the same version.
      # Unpinned, CI installs whatever is newest and its rule set moves underneath the repo: UP038
      # has changed shape between releases, so a push that touched nothing could fail lint while
      # `make lint` passed locally. A lint failure has to mean the code changed.
      - run: pip install -r requirements.txt "ruff==0.16.5"
      - name: Lint
        run: ruff check tradeos tests   # linter only; see the note in pyproject.toml
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The cross-language guard on the sealed wire format, and the ONLY place it runs
      # automatically. `chain.py` and `receipts/verify.js` must produce byte-identical payloads
      # forever — the public record page lets a visitor recompute the chain in their own browser,
      # and a JS framing that disagrees by one byte reports every intact record as broken. The
      # `test` job above cannot check it: no node, and no database, so the tests that would reach
      # it skip. This job already has node, and the script needs no npm dependencies and no
      # network — it reads a committed fixture that Python is pinned to from the other side.
      - name: the sealed wire format, checked from JavaScript
        working-directory: .
        run: node tests/verify_js_check.mjs
