# Secret-scanning tripwire (founding brief: scan every commit; treat a leaked key as an
# incident with a runbook, not a quiet fix — see docs/runbooks/leaked-secret.md).
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files          # or a full-history scan: gitleaks detect --source .
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
