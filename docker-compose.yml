services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeos}
      # NO DEFAULT, ON PURPOSE. This read `tradeos` for months in a file that is about to be
      # public, so every self-hoster would have inherited the same password on a database whose
      # port is published — and anyone who widened that port past loopback would have been
      # trivially readable. `:?` makes compose refuse to start and print the message, rather than
      # silently accepting an empty string, which is what `${VAR:-}` would do.
      #
      # `scripts/setup.sh` writes a generated value into .env, so the quickstart stays one command.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — run ./scripts/setup.sh to generate one}
      POSTGRES_DB: ${POSTGRES_DB:-tradeos}
    # Bound to the loopback interface ONLY. The nightly backup now connects to this port
    # from the host instead of going through `docker compose exec`, so the port has to be
    # published — but published on 0.0.0.0, as it was, this database was reachable from
    # every machine on the local network with the plain-text password three lines above.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeos}"]
      interval: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradeos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tradeos}
      # The origin this instance is reachable at from outside. Every og:image and
      # og:url is built from it, so unset means every shared record previews as a
      # bare text link. Enumerated in BOTH services (CLAUDE.md 0i).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Alpaca is THE price source — the only one. Both halves of the
      # Alpaca credential are required — a key id without its secret is an anonymous client
      # that 403s on every bar. Free key: https://app.alpaca.markets/signup
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # The background worker: the same image running the scheduler loop, so prices come in and calls
  # get scored with nobody watching. Keeps the API process stateless. Shares the DB and .env config.
  worker:
    build: .
    command: ["python", "-m", "tradeos.cli", "scheduler"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradeos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tradeos}
      # The origin this instance is reachable at from outside. Every og:image and
      # og:url is built from it, so unset means every shared record previews as a
      # bare text link. Enumerated in BOTH services (CLAUDE.md 0i).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Alpaca is THE price source — the only one. Both halves of the
      # Alpaca credential are required — a key id without its secret is an anonymous client
      # that 403s on every bar. Free key: https://app.alpaca.markets/signup
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
