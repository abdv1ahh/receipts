# One formatter and one linter, configured once (brief §5). Ruff is both, in one dependency.
[tool.ruff]
line-length = 108          # matches the existing code, which is written wider than 79
target-version = "py312"
exclude = ["frontend", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes: unused imports/variables, undefined names
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade: modern syntax for the target version
    "B",      # bugbear: likely bugs (mutable defaults, unused loop vars, ...)
    "S",      # bandit: security patterns — this app sits next to money and untrusted text
    "C4",     # comprehension clarity
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "S101",   # assert: fine in tests, and used as an invariant check in a few places
    "B008",   # FastAPI's Depends()/Cookie() defaults are the framework's idiom
]

# S608 (SQL built by string concatenation) is ON as of Phase 9. It was suppressed while 17 call
# sites built SQL with f-strings; each interpolated only module constants, generated "%s"
# placeholder lists, or a table name from a hardcoded allowlist, so none was injectable — but
# "safe because it was read once" is precisely the guarantee that decays as a file grows. All 17
# now compose with `psycopg.sql` (Identifier / Placeholder / SQL), which makes the invariant —
# nothing derived from a request may reach a query string — hold by type rather than by review.
# Turning the rule back on is the point: the next f-string SQL is a lint failure, not a discussion.

[tool.ruff.lint.per-file-ignores]
# Hardcoded test credentials and non-crypto randomness. S608 is off in tests only because
# test_slice2.py builds a REGEX asserting each migration registers its own version — it matches
# "INSERT INTO schema_migrations" and ruff cannot tell an assertion about SQL from SQL.
"tests/*" = ["S105", "S106", "S311", "S608"]

# NOT adopting `ruff format`. Checked against the tree on 2026-07-25: it de-indents continuation
# strings so they lose their visual association with the key they belong to, and it strips the
# aligned trailing comments this codebase uses consistently in ~89 files. That is a large, purely
# mechanical diff that makes the code harder to read, which fails the brief's own test — match the
# existing conventions unless they are actively harmful. Ruff is the linter here; the style is the
# house style. Revisit only if the style stops being consistent.
[tool.ruff.format]
quote-style = "double"
